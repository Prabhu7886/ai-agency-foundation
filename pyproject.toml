[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agency-foundation"
version = "0.1.0"
description = "Local-first secure AI agency orchestration foundation"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "dashboard*", "databases*", "knowledge_pipeline*", "tools*", "utils*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
