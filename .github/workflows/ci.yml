name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-tests:
    name: security-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audited dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile source
        run: python -m compileall -q agents dashboard databases knowledge_pipeline tools utils run_agency.py

      - name: Run tests
        run: python -m pytest -q

      - name: Audit dependencies
        run: python -m pip_audit --progress-spinner off --ignore-vuln PYSEC-2026-311
